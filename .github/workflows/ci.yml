name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and production builds
        run: npm run check

      - name: Run C++ tests
        run: ctest --preset debug --output-on-failure

      - name: Run process-level UCI tests
        env:
          CATFISH_ENGINE_PATH: build/debug/catfish_uci
        run: npm run test:uci-process

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow
        env:
          CATFISH_ENGINE_PATH: build/debug/catfish_uci
        run: npm run test:e2e -- --project=chromium

      - name: Build production container
        run: docker build --tag catfish-chess:ci .
